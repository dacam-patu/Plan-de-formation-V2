<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="authScreen">
  <div class="auth-card">
    <img class="logo-lg-img" src="logo.png" alt="Lycée Professionnel Patu de Rosemont" style="display:block;max-width:300px;width:100%;height:auto;margin:0 auto 14px">
    <h2>Plan de formation</h2>
    <div class="sub">Connectez-vous pour accéder à vos plans</div>
    <div class="auth-tabs">
      <button id="tabSignin" class="on">Connexion</button>
      <button id="tabSignup">Créer un compte</button>
    </div>
    <div class="field" id="fldName" style="display:none">
      <input type="text" id="authName" placeholder="Nom complet (ex. M. CAMALON David)">
    </div>
    <div class="field"><input type="email" id="authEmail" placeholder="Adresse e-mail" autocomplete="username"></div>
    <div class="field"><input type="password" id="authPass" placeholder="Mot de passe" autocomplete="current-password"></div>
    <div class="auth-msg" id="authMsg"></div>
    <button class="primary" id="authSubmit">Se connecter</button>
    <div class="auth-foot">Vos données sont stockées de façon sécurisée (Supabase).</div>
  </div>
</div>

<div id="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand"><img id="brandLogo" class="brand-logo" alt="Logo"><span>Plan de formation</span></div>
    <div class="plan-picker">
      <select id="planSel" title="Choisir un plan"></select>
      <button class="icon" id="btnPlanMenu" title="Gérer les plans">⋯</button>
    </div>
    <span class="ro-badge" id="roBadge" style="display:none">🔒 Lecture seule</span>
    <span class="pub-badge" id="pubBadge" style="display:none">🌍 Publié</span>
    <span class="shared-badge" id="sharedBadge" style="display:none" title="Un collègue vous a autorisé à modifier ce plan">👥 Partagé avec vous</span>
    <div class="saved" id="savedInd" title="État de l'enregistrement en base"><span class="dot"></span><span class="lbl">Enregistré</span></div>
    <div class="spacer"></div>
    <button id="btnNew">＋ Nouveau plan</button>
    <div class="menu-wrap">
      <button class="primary" id="btnExport">⤓ Exporter ▾</button>
    </div>
    <div class="menu-wrap">
      <button id="btnMore">⋯</button>
    </div>
    <div class="userbar">
      <div class="who"><b id="userEmail"></b><span class="badge-role" id="userRole"></span></div>
      <button class="icon ghost" id="btnLogout" title="Se déconnecter">⎋</button>
    </div>
  </div>

  <!-- SUB TOOLBAR -->
  <div class="subbar">
    <div class="tabs" id="yearTabs"></div>
    <span class="chip" id="planTitleChip"></span>
    <div class="spacer"></div>
    <label class="switch" title="Activer la modification">
      <input type="checkbox" id="editToggle">
      <span class="track"><span class="knob"></span></span>
      <span>Mode édition</span>
    </label>
    <div class="tool-group">
      <span class="lbl">Prof.</span>
      <select id="teacherFilter" title="Voir les créneaux d'un professeur" style="width:auto;min-width:120px"></select>
      <button id="btnTeachers" title="Importer / gérer les professeurs">👤 Professeurs</button>
    </div>
    <div class="tool-group">
      <span class="lbl">Police</span>
      <select id="fontSel" title="Police de tout le tableau" style="width:auto;min-width:130px"></select>
    </div>
    <div class="tool-group">
      <span class="lbl">Taille</span>
      <button class="icon" id="fsDown" title="Réduire la taille du texte">A−</button>
      <span id="fsVal" style="width:34px;text-align:center;font-weight:600">12</span>
      <button class="icon" id="fsUp" title="Augmenter la taille du texte">A＋</button>
    </div>
    <div class="tool-group">
      <span class="lbl">Zoom</span>
      <button class="icon" id="zoomOut">−</button>
      <span id="zoomVal" style="width:44px;text-align:center;font-weight:600">100%</span>
      <button class="icon" id="zoomIn">＋</button>
    </div>
  </div>

  <!-- GRID -->
  <div class="scroll" id="scroll">
    <div id="printHead"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="dh"><h3 id="drawerTitle">Modifier</h3><button class="icon ghost" id="drawerClose">✕</button></div>
  <div class="db">
    <div class="field">
      <label id="lblRow">Ligne</label>
      <select id="fRow"></select>
    </div>
    <div class="field">
      <label>Contenu / activité</label>
      <textarea id="fText" placeholder="Décrivez l'activité, la séquence, la compétence…"></textarea>
    </div>
    <div class="row2">
      <div class="field"><label>Semaine de début</label><select id="fStart"></select></div>
      <div class="field"><label>Semaine de fin</label><select id="fEnd"></select></div>
    </div>
    <div class="field">
      <label>Couleur</label>
      <div class="swatches" id="fSwatches"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Police</label><select id="fFont"></select></div>
      <div class="field"><label>Taille du texte</label><select id="fSize"></select></div>
    </div>
    <div class="field" id="fTeachersField">
      <label>Professeur(s) affecté(s)</label>
      <div id="fTeachers" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="field" id="fCodesField">
      <label>Compétences & tâches (référentiel BTS)</label>
      <div id="fCodes" style="display:flex;flex-wrap:wrap;gap:5px;align-items:center"></div>
      <button type="button" id="fCodesBtn" style="margin-top:8px">＋ Choisir compétences / tâches</button>
    </div>
    <div class="field">
      <label>Bibliothèque de blocs</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="fLib" style="flex:1" title="Insérer un bloc enregistré"></select>
        <button type="button" id="fLibUse" title="Remplir avec ce bloc">Insérer</button>
        <button type="button" id="fLibSave" title="Enregistrer le bloc courant">💾</button>
      </div>
    </div>
  </div>
  <div class="df">
    <button class="danger" id="fDelete">🗑 Supprimer</button>
    <div class="spacer" style="flex:1"></div>
    <button id="fCancel">Annuler</button>
    <button class="primary" id="fSave">Enregistrer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Zone d'impression multi-pages (1 page A3 par année) -->
<div id="printArea"></div>

<!-- Données + application (fichiers séparés) -->
<script src="seed.js" charset="UTF-8"></script>
<script src="app.js" charset="UTF-8"></script>
</body>
</html>
